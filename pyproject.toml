[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-controls"
version = "0.1.1"
description = "Deterministic checks for repositories that follow the repo-template layout."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deterministic_controls.catalog" = ["*.toml"]
"deterministic_controls.adopt" = ["templates/*"]
